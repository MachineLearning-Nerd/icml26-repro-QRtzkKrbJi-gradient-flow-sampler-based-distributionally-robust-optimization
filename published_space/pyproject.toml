[project]
name = "gfs-dro-reproduction"
version = "0.1.0"
description = "Claim-by-claim CPU reproduction of Gradient Flow Sampler-based DRO"
requires-python = ">=3.12,<3.13"
dependencies = [
  "marimo>=0.14,<1",
  "matplotlib>=3.10,<4",
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "scipy>=1.15,<2",
  "sympy>=1.13,<2",
  "torch>=2.7,<3",
  "torchvision>=0.22,<1",
  "tqdm>=4.67,<5",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

